name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned on purpose: ruff's formatter and its lint rules both move between
      # releases, and a formatting change landing as a red build on an unrelated
      # PR is not information. Bump it deliberately.
      - run: pip install ruff==0.16.2
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    # The claim in the README is that the tests run anywhere -- the parts
    # carrying the design (the morph table above all) are pure. This matrix is
    # what keeps that true, so Windows-only regressions cannot hide behind a
    # Linux-only suite, and Linux-only breakage cannot hide behind Windows.
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A full leg is install plus a suite that runs in seconds. Ten minutes is
    # generous headroom and still cuts a wedged run short: faulthandler prints
    # the stacks at 60s but lets the process keep blocking, so something has to
    # end the job.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt runtime libraries
        # PyQt6's wheel links these even for the offscreen platform plugin; the
        # Ubuntu image does not ship them.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: pytest

      - name: Doctor
        # On Windows every optional backend is actually installed, so this is
        # the one place the import of pycaw, pyvda, WMI and the WinRT
        # projections is exercised at all. It exits non-zero only on a blocker.
        if: runner.os == 'Windows'
        run: python -m shell.doctor

  preview:
    # The renderers are how the design is reviewed without a Windows box, so
    # they are worth keeping green -- and the PNGs make a diff's visual effect
    # inspectable from the run summary.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Render every state
        run: python tools/preview.py out/
      - name: Render the morphs
        run: |
          python tools/filmstrip.py idle controlCenter out/morph-control-center.png
          python tools/filmstrip.py idle launcher out/morph-launcher.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
          if-no-files-found: error
          retention-days: 14

  package:
    # Freezing is the step most likely to break silently -- a hidden import the
    # module graph cannot see costs a feature only at runtime, on a machine the
    # CI does not have. Building on every push means the release tag is never
    # the first time the spec is run.
    needs: [lint, test]
    uses: ./.github/workflows/build-windows.yml
    with:
      artifact-name: chillpill-win-x64-dev
      retention-days: 7
