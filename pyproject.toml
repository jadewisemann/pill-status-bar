[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chillpill-win"
version = "0.1.0"
description = "A morphing pill shell for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["windows", "shell", "status-bar", "desktop"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PyQt6>=6.6",
    "pydantic>=2.5",
    "watchdog>=4.0",
    # -- Windows only ------------------------------------------------------
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "WMI>=1.5; sys_platform == 'win32'",
    # Virtual desktops.  Upstream pyvda tracks COM interface GUIDs that Microsoft
    # changes between Windows 11 builds, so a new build can break it until pyvda
    # catches up -- `"workspaceBackend": "none"` is the escape hatch.
    "pyvda>=0.6; sys_platform == 'win32'",
    # WinRT is one distribution per namespace.  Only the ones actually reached
    # are listed, but that includes the namespaces of *returned* types, not just
    # the ones imported by name: iterating a notification list needs
    # Foundation.Collections, and reading a toast's source app needs
    # ApplicationModel, even though neither appears in an import statement.
    "winrt.windows.foundation>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.foundation.collections>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.applicationmodel>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.data.xml.dom>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.media>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.media.control>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.storage.streams>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.ui>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.ui.notifications>=3.2.1; sys_platform == 'win32'",
    "winrt.windows.ui.notifications.management>=3.2.1; sys_platform == 'win32'",
    # Icon extraction for the built-in launcher (skipped when Flow handles it).
    "Pillow>=10.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
chillpill = "shell.app:run"
chillpillc = "shell.cli:main"
chillpill-doctor = "shell.doctor:main"

[project.urls]
Homepage = "https://github.com/jadewisemann/pill-status-bar"

[tool.setuptools]
packages = ["shell", "shell.modules", "shell.surfaces", "shell.platform", "shell.ipc", "vendor", "vendor.win32", "vendor.win32.bindings", "vendor.compat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `tools/` is a developer script directory, not part of the installed package,
# and test_vendor.py imports the vendoring script to check its own work. Without
# this, the suite passes under `python -m pytest` (which puts the repo root on
# sys.path) and fails under a bare `pytest`, which is what CI and the README use.
pythonpath = ["."]
# No test here does real work: the whole suite runs in seconds. A test that
# takes a minute is blocked on something -- a pipe, a thread, a socket -- and
# the stack of every thread at that moment is the only useful thing to know
# about it. Without this a blocked test is a silent CI job that ends at the
# runner's timeout with nothing to read.
faulthandler_timeout = 60

[tool.ruff]
line-length = 120
target-version = "py311"
# vendor/ is upstream code kept byte-identical apart from import rewrites.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "N802",  # Qt overrides are camelCase by definition
    "B008",  # Qt constructors in defaults are fine
]
