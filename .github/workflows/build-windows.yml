name: Build (Windows)

# The packaged build, called by both CI and Release so the artifact a release
# ships is byte-for-byte the same recipe CI has been exercising all along.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the uploaded artifact.
        type: string
        default: chillpill-win-x64
      python-version:
        description: Python the bundle is frozen against.
        type: string
        default: "3.12"
      retention-days:
        type: number
        default: 14
    outputs:
      version:
        description: Version read from pyproject.toml.
        value: ${{ jobs.build.outputs.version }}
      zip:
        description: File name of the built zip.
        value: ${{ jobs.build.outputs.zip }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.package.outputs.zip }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller>=6.11,<7"

      - name: Record the dependency versions
        # GPLv3 asks for the source corresponding to the binary; the pinned
        # closure that produced it is part of that answer.
        run: pip freeze --exclude-editable | Tee-Object -FilePath requirements-frozen.txt

      - name: Read the version
        id: version
        run: |
          $v = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"

      - name: Freeze
        run: pyinstaller --noconfirm --clean packaging/chillpill.spec

      - name: Smoke test the bundle
        # `doctor` reaches every backend through the frozen import machinery, so
        # it answers the two questions a spec file actually gets wrong: does the
        # bundle import itself at all, and did a hidden import the module graph
        # could not see get left out?
        #
        # Its own exit code only covers the first -- a missing backend is a
        # degraded feature, not a blocker, which is right on a user's machine
        # and wrong here. Off a Windows build every dependency below is a hard
        # requirement in pyproject.toml, so anything short of [+] means the
        # bundle lost it and the release would ship a feature that silently
        # does nothing.
        env:
          # The runner has no desk; doctor builds a QGuiApplication to ask Qt
          # about fonts, and offscreen keeps that from depending on one.
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Test-Path dist/ChillPill/ChillPill.exe)) { throw "windowed executable missing" }

          $report = @(& ./dist/ChillPill/ChillPill-console.exe doctor | ForEach-Object { [string]$_ })
          $report | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "doctor reported a blocker in the frozen bundle" }

          $required = @(
            'PyQt6', 'pydantic', 'watchdog',
            'pywin32', 'comtypes', 'pycaw', 'WMI', 'pyvda', 'Pillow',
            'WinRT (media)', 'WinRT (notifications)'
          )
          $lost = @()
          foreach ($name in $required) {
            $pattern = '^\[.\]\s+' + [regex]::Escape($name) + '\s'
            $line = @($report | Where-Object { $_ -match $pattern })[0]
            if (-not $line) { $lost += "$name (no line in the report)"; continue }
            if ($line -notmatch '^\[\+\]') { $lost += $name }
          }
          if ($lost.Count -gt 0) {
            throw "the frozen bundle is missing: $($lost -join ', '). Add it to hiddenimports in packaging/chillpill.spec."
          }

      - name: Stage the licences
        # Shipping the binary means shipping the terms it comes under, plus the
        # attribution the vendored MIT code requires.
        run: |
          $d = "dist/ChillPill"
          Copy-Item LICENSE, NOTICE, README.md, requirements-frozen.txt $d
          Copy-Item packaging/BINARY-LICENSE.md $d
          New-Item -ItemType Directory -Path "$d/docs" | Out-Null
          Copy-Item docs/CREDITS.md, docs/RISKS.md, docs/SPEC.md "$d/docs"
          New-Item -ItemType Directory -Path "$d/vendor" | Out-Null
          Copy-Item vendor/LICENSE.yasb, vendor/README.md "$d/vendor"

      - name: Package
        id: package
        run: |
          $name = "ChillPill-Win-${{ steps.version.outputs.version }}-win64"
          Rename-Item dist/ChillPill $name
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii -NoNewline
          "zip=$name.zip" >> $env:GITHUB_OUTPUT
          Write-Host "$name.zip  $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
